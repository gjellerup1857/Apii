name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate manifest
        run: python3 -m json.tool manifest.json > /dev/null && echo "manifest ok"
      - name: Syntax check (Node)
        run: |
          node --check background.js
          node --check content.js
          node --check injected.js
          node --check popup.js
          node --check fullpage.js
          node --check floating-panel.js
          echo "syntax ok"
      - name: Build zip
        run: |
          zip -r dist/brave-api-inspector.zip . -x "*.git*" "*.DS_Store" "dist/*" "*.zip" "node_modules/*"
          ls -lh dist/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: brave-api-inspector
          path: dist/brave-api-inspector.zip
