name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          zip -r dist/brave-api-inspector-v${VERSION}.zip . -x "*.git*" "*.DS_Store" "dist/*" "*.zip" "node_modules/*"
          ls -lh dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
